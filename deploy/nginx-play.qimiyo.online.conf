# play.qimiyo.online -> 本机卫戍协议。不要把这段放进 www.qimiyo.online 的站点。
# 首次安装只监听 80。install.sh 会调用 certbot 加上 443。
# 若此文件已含 ssl_certificate，再次安装不会覆盖。

map $http_upgrade $stronghold_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name play.qimiyo.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $stronghold_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
